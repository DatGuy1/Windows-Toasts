name: Deploy

on:
  push:
    tags:
      # These tags are protected
      - "v[0-9]+.[0-9]+.[0-9]+"

# Set permissions at the job level.
permissions: {}

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.repository == 'DatGuy1/Windows-Toasts'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"

      - name: Build package
        run: uv build --no-sources

      - name: Check the package version matches the tag
        run: |
          if ! test -f "dist/windows_toasts-${GITHUB_REF_NAME#v}-py3-none-any.whl"; then
            echo "::error::Built $(ls dist), which doesn't match the tag $GITHUB_REF_NAME. Update _version.py"
            exit 1
          fi

      - name: Extract release notes
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          uv run --no-project python scripts/extract_release_notes.py "$GITHUB_REF_NAME" | pandoc --from rst --to gfm --wrap=preserve --output release-notes.md
          cat release-notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/Windows-Toasts/
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --notes-file artifacts/release-notes/release-notes.md
