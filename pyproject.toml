[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "Windows-Toasts"
dynamic = ["version"]
description = "Python library used to send toast notifications on Windows machines"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["windows", "toast", "notifications", "winrt"]
authors = [{ name = "DatGuy" }]
requires-python = ">=3.11"
dependencies = [
    "winrt-runtime>=4.0",
    "winrt-Windows.Data.Xml.Dom>=4!0",
    "winrt-Windows.Foundation>=4!0",
    "winrt-Windows.Foundation.Collections>=4!0",
    "winrt-Windows.UI.Notifications>=4!0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Documentation = "https://windows-toasts.readthedocs.io"
Source = "https://github.com/DatGuy1/Windows-Toasts"
Issues = "https://github.com/DatGuy1/Windows-Toasts/issues"
Changelog = "https://github.com/DatGuy1/Windows-Toasts/blob/main/CHANGELOG.rst"

[project.scripts]
register_hkey_aumid = "windows_toasts.register_hkey_aumid:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "ty>=0.0.107",
]
docs = [
    "sphinx>=8.2.3,<9",
    "sphinx-jinja2-compat>=0.4.1",
    "sphinx-toolbox>=4.3.1",
    "enum-tools>=0.13.0",
    "furo>=2025.12.19",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
windows_toasts = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "windows_toasts._version.__version__" }

[tool.ruff]
line-length = 120

[tool.ruff.format]
skip-magic-trailing-comma = true
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/windows_toasts/__init__.py" = ["E402"]  # The OS version check must run before the winrt imports

[tool.ruff.lint.isort]
combine-as-imports = true
split-on-trailing-comma = false

[tool.pytest.ini_options]
pythonpath = ["src"]
filterwarnings = ["error"]

[tool.ty.environment]
python-platform = "win32"

[tool.ty.src]
include = ["src"]

[tool.uv.dependency-groups]
docs = { requires-python = ">=3.14" }
